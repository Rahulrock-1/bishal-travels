services:
  - type: web
    name: bishal-travels-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        sync: false
        # Paste your Supabase PostgreSQL connection string in the Render Dashboard:
        # Host=db.xxx.supabase.co;Port=5432;Database=postgres;Username=postgres;Password=YOUR_PASSWORD;SSL Mode=Require;Trust Server Certificate=true;
      - key: RABBITMQ_ADMIN_USER
        value: Rahul
      - key: RABBITMQ_ADMIN_PASS
        value: Rahul@1998
